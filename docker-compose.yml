services:
  postgres:
    image: postgres:16
    container_name: smartdeck-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: smartdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: smartdeck-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
